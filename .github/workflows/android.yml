# Builds the Android app (android/) and runs its unit tests on every push that
# touches it. Each pushed build is published as a GitHub Release with the APK
# attached, so the newest one is always one tap away on a phone:
#   https://github.com/Fazel-AVB/language_flashcards/releases/latest/download/Flashcards.apk
# (Run artifacts download only as zips and are awkward on mobile.)
name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to publish the release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Signing key
        # Two repository secrets (Settings > Secrets and variables > Actions): the keystore as
        # base64, and its password. Every build is then signed alike, so it installs as an update.
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Pasting the long secret (on a phone especially) can add spaces or line breaks: drop them.
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' > "$RUNNER_TEMP/key.b64"
            echo "Secret: $(wc -c < "$RUNNER_TEMP/key.b64") base64 characters (3520 expected)"
            if ! base64 -d "$RUNNER_TEMP/key.b64" > "$RUNNER_TEMP/sideload.jks" 2>/dev/null; then
              echo "::error::SIGNING_KEYSTORE_BASE64 is not valid base64: paste the whole key file content again."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/sideload.jks" -storepass "$SIGNING_PASSWORD" >/dev/null 2>&1; then
              echo "::error::The keystore in SIGNING_KEYSTORE_BASE64 can't be opened with SIGNING_PASSWORD (incomplete key, or wrong password)."
              exit 1
            fi
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: signed with a throwaway debug key, so this APK won't install over an earlier one."
          fi
      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Flashcards.apk
      - uses: actions/upload-artifact@v4
        with:
          name: flashcards-apk
          path: android/Flashcards.apk
          if-no-files-found: error
      - name: Publish as a release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Flashcards for Android (build ${{ github.run_number }})
          body: |
            Tap **Flashcards.apk** below to download, then open it to install.
            Built from ${{ github.ref_name }} at ${{ github.sha }}.
          files: android/Flashcards.apk
          make_latest: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/app/build/reports/
